{% extends "base.html" %}

{% block title %}Reset Password Request | SynthSoma{% endblock %}

{% block content %}
<div class="container auth-wrapper">
    <div class="auth-card auth-card-narrow">
        <div class="auth-header text-center">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2>Password Recovery</h2>
            <p>Enter the email address associated with your SynthSoma account.</p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">Gmail / Registered Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-auth">
                <i class="fa-solid fa-paper-plane"></i> Send Recovery Token
            </button>
        </form>

        <div class="auth-footer text-center">
            <p>Remembered your password? <a href="{{ url_for('auth.login') }}">Return to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
