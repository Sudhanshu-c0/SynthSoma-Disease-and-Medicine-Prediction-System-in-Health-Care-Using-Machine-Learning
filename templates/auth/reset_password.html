{% extends "base.html" %}

{% block title %}Set New Password | SynthSoma{% endblock %}

{% block content %}
<div class="container auth-wrapper">
    <div class="auth-card auth-card-narrow">
        <div class="auth-header text-center">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h2>Set New Password</h2>
            <p>Enter your new password below to regain account access.</p>
        </div>

        <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required autofocus>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-type new password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-auth">
                <i class="fa-solid fa-check"></i> Update Password & Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
