{% extends "base.html" %}

{% block title %}404 - Page Not Found | SynthSoma{% endblock %}

{% block content %}
<div class="container text-center" style="padding: 90px 20px;">
    <div style="font-size: 64px; color: var(--text-muted); margin-bottom: 16px;">
        <i class="fa-solid fa-file-circle-question"></i>
    </div>
    <h1 style="font-size: 32px; font-weight: 800; color: var(--dark); margin-bottom: 10px;">404 - Page Not Found</h1>
    <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 24px auto;">
        The clinical resource or requested URL could not be located on the SynthSoma system.
    </p>
    <a href="{{ url_for('dashboard.dashboard') if current_user.is_authenticated else url_for('home.index') }}" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
