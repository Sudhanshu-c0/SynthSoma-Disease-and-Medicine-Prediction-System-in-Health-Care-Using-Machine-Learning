{% extends "base.html" %}

{% block title %}Change Password | SynthSoma{% endblock %}

{% block content %}
<div class="container auth-wrapper">
    <div class="auth-card auth-card-narrow">
        <div class="auth-header text-center">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2>Change Password</h2>
            <p>Ensure your account remains protected with a secure password.</p>
        </div>

        <form action="{{ url_for('profile.change_user_password') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="current_password" class="form-label">Current Password</label>
                <input type="password" id="current_password" name="current_password" class="form-control" placeholder="Enter current password" required autofocus>
            </div>

            <div class="form-group">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-type new password" required>
            </div>

            <div class="form-actions-bar">
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-lock"></i> Update Password
                </button>
            </div>
        </form>

        <div class="auth-footer text-center">
            <a href="{{ url_for('profile.view_profile') }}"><i class="fa-solid fa-arrow-left"></i> Return to Profile</a>
        </div>
    </div>
</div>
{% endblock %}
