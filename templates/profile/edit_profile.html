{% extends "base.html" %}

{% block title %}Edit Profile | SynthSoma{% endblock %}

{% block content %}
<div class="container auth-wrapper">
    <div class="auth-card auth-card-narrow">
        <div class="auth-header text-center">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-user-pen"></i>
            </div>
            <h2>Update Profile Details</h2>
            <p>Update your personal information below.</p>
        </div>

        <form action="{{ url_for('profile.edit_profile') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ form.name or user.name }}" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address (Read-only)</label>
                <input type="email" id="email" class="form-control" value="{{ user.email }}" disabled>
            </div>

            <div class="form-group">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-control" value="{{ form.phone or user.phone }}" required>
            </div>

            <div class="form-group">
                <label for="location" class="form-label">Location / City</label>
                <input type="text" id="location" name="location" class="form-control" value="{{ form.location or user.location }}" required>
            </div>

            <div class="form-actions-bar">
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-save"></i> Save Changes
                </button>
            </div>
        </form>

        <div class="auth-footer text-center">
            <a href="{{ url_for('profile.view_profile') }}"><i class="fa-solid fa-arrow-left"></i> Return to Profile</a>
        </div>
    </div>
</div>
{% endblock %}
